<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar oportunidad | ConectaObra</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="assets/ui.css?v=56"><script src="assets/ui.js?v=56" defer></script></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"><img src="assets/logo-symbol.png" alt=""></span><b>CONECTA<span>OBRA</span></b></a><div class="nav-actions"><a class="btn btn-outline-dark" href="oportunidades.html">Volver</a><button class="btn btn-outline-dark" data-logout>Salir</button></div></div></header><main class="auth-wrap"><div class="auth-card"><div class="eyebrow">Área privada</div><h1>Editar oportunidad</h1><div id="appMsg" hidden></div><form id="editOppForm"><div class="form-grid"><div class="field full"><label>Título *</label><input name="title" maxlength="190" required></div><div class="field"><label>Provincia *</label><select name="province" required><option value="">Selecciona</option><option>Álava</option><option>Albacete</option><option>Alicante</option><option>Almería</option><option>Asturias</option><option>Ávila</option><option>Badajoz</option><option>Barcelona</option><option>Bizkaia</option><option>Burgos</option><option>Cáceres</option><option>Cádiz</option><option>Cantabria</option><option>Castellón</option><option>Ceuta</option><option>Ciudad Real</option><option>Córdoba</option><option>Cuenca</option><option>Gipuzkoa</option><option>Girona</option><option>Granada</option><option>Guadalajara</option><option>Huelva</option><option>Huesca</option><option>Illes Balears</option><option>Jaén</option><option>La Coruña</option><option>La Rioja</option><option>Las Palmas</option><option>León</option><option>Lleida</option><option>Lugo</option><option>Madrid</option><option>Málaga</option><option>Melilla</option><option>Murcia</option><option>Navarra</option><option>Ourense</option><option>Palencia</option><option>Pontevedra</option><option>Salamanca</option><option>Santa Cruz de Tenerife</option><option>Segovia</option><option>Sevilla</option><option>Soria</option><option>Tarragona</option><option>Teruel</option><option>Toledo</option><option>Valencia</option><option>Valladolid</option><option>Zamora</option><option>Zaragoza</option></select></div><div class="field"><label>Categoría *</label><input name="category" maxlength="120" required></div><div class="field full"><label>Descripción *</label><textarea name="description" maxlength="10000" required></textarea></div></div><div class="form-actions sticky-actions"><button class="btn btn-primary" type="submit">Guardar cambios</button><a class="btn btn-outline-dark" href="oportunidades.html">Cancelar</a></div></form></div></main><script src="assets/app.js?v=56"></script><script>
(async()=>{const id=Number(new URLSearchParams(location.search).get('id'));const f=document.getElementById('editOppForm');const m=await fetch(`api.php?action=me`,{cache:'no-store'}).then(r=>r.json());if(!m.user){location.href='login.html';return} if(!id){location.href='oportunidades.html';return} const r=await fetch(`api.php?action=my_opportunities`,{cache:'no-store'}).then(x=>x.json());const o=(r.opportunities||[]).find(x=>Number(x.id)===id);if(!o){document.getElementById('appMsg').textContent='No se ha encontrado la oportunidad.';document.getElementById('appMsg').className='notice error';document.getElementById('appMsg').hidden=false;f.hidden=true;return} for(const k of ['title','province','category','description'])f.elements[k].value=o[k]||'';f.addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));d.id=id;const token=m.csrf||'';const x=await fetch('api.php?action=update_opportunity',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':token},body:JSON.stringify({...d,_csrf:token})}).then(x=>x.json());const box=document.getElementById('appMsg');box.textContent=x.message||x.error||'';box.className='notice '+(x.ok?'success':'error');box.hidden=false;if(x.ok)setTimeout(()=>location.href='oportunidades.html',700);});})();
</script></body></html>
