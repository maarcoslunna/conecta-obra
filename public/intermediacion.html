<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitar intermediación | ConectaObra</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="assets/ui.css?v=56"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><b>CONECTA<span>OBRA</span></b></a><div class="nav-actions"><a class="btn btn-outline-dark" href="panel.html">Mi panel</a></div></div></header><main class="dashboard"><div class="container" style="max-width:760px"><section class="panel" style="padding:28px"><div class="eyebrow">Servicio adicional</div><h1>Solicitar intermediación a comisión</h1><p>Sin cuota fija ni compromiso por enviar esta solicitud. Las condiciones de cada operación se acordarán por escrito. La comisión solo corresponderá a operaciones pactadas y efectivamente cobradas.</p><div id="medMsg" role="status" hidden></div><form id="medForm"><div class="field"><label for="subject">Asunto de la solicitud *</label><input id="subject" name="subject" maxlength="190" required></div><div class="field"><label for="details">¿Qué operación o apoyo comercial necesitas? *</label><textarea id="details" name="details" rows="7" maxlength="5000" required></textarea></div><button class="btn btn-primary" type="submit">Enviar solicitud sin compromiso</button></form></section></div></main><script>
(async()=>{const msg=document.getElementById('medMsg'),form=document.getElementById('medForm');let csrf='';try{const m=await fetch('api.php?action=me',{credentials:'same-origin'}).then(r=>r.json());if(!m.user){location.href='login.html?next=intermediacion.html';return}csrf=m.csrf||''}catch(e){msg.hidden=false;msg.textContent='No se pudo comprobar la sesión.';form.hidden=true;return}form.addEventListener('submit',async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;try{const d=Object.fromEntries(new FormData(form));d._csrf=csrf;const r=await fetch('api.php?action=mediation_create',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(d)}).then(x=>x.json());msg.hidden=false;msg.className=r.ok?'notice success':'notice error';msg.textContent=r.ok?'Solicitud registrada. Puedes seguir su estado desde tu panel.':(r.error||'No se pudo enviar.');if(r.ok)form.reset()}catch(e){msg.hidden=false;msg.textContent='Error de conexión. Inténtalo de nuevo.'}finally{b.disabled=false}})})();
</script></body></html>
