<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pago en proceso | ConectaObra</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="assets/ui.css?v=56"><script src="assets/ui.js?v=56" defer></script></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"><img src="assets/logo-symbol.png" alt=""></span><b>CONECTA<span>OBRA</span></b></a></div></header><main class="auth-wrap"><div class="auth-card center"><div class="eyebrow">Pago recibido</div><h1>Estamos activando tu plan.</h1><p class="lead">Stripe ha terminado el proceso de Checkout. La activación definitiva se confirma mediante el webhook de ConectaObra.</p><div id="status" class="notice">Comprobando estado…</div><div class="form-actions"><a class="btn btn-primary" href="panel.html">Ir a mi panel</a><a class="btn btn-outline-dark" href="index.html">Volver al inicio</a></div></div></main><script>async function check(){try{const r=await fetch('api.php?action=billing_status',{cache:'no-store'}).then(x=>x.json());const e=document.querySelector('#status');if(r.ok&&r.subscription){e.textContent='Plan actual: '+r.subscription.plan_label+' · Estado: '+r.subscription.status;e.className='notice success';}else{e.textContent='El pago se ha recibido. La activación puede tardar unos segundos.';}}catch(e){}}check();</script></body></html>
